name: "Tip stopped working"
description: "A tip no longer does what its steps say."
labels: ["broken"]
body:
  - type: input
    id: skill
    attributes:
      label: "Tip"
      placeholder: "status-line-cache-countdown"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: "Agent and model"
      placeholder: "Claude Code 2.1.312, Opus 5.5"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened"
    validations:
      required: true
