name: "Suggest a tip"
description: "A post on X with a prompt, rules or a setup worth adding to Copybook."
labels: ["suggestion"]
body:
  - type: input
    id: link
    attributes:
      label: "Link to the post"
      placeholder: "https://x.com/…/status/…"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "What it does for you"
