name: "Translation fix · 译文修正"
description: "A line in the Chinese edition reads wrong. 中文版里有一句不对。"
labels: ["translation"]
body:
  - type: input
    id: skill
    attributes:
      label: "Tip · 技巧"
      placeholder: "status-line-cache-countdown"
    validations:
      required: true
  - type: textarea
    id: line
    attributes:
      label: "The line, and what it should say · 原句和建议"
    validations:
      required: true
